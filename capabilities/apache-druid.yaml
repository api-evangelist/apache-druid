naftiko: 1.0.0-alpha2
info:
  label: Apache Druid REST API
  description: 'Apache Druid REST API. 13 operations. Lead operation: Mark segments in an interval as unused. Self-contained
    Naftiko capability covering one Apache Druid business surface.'
  tags:
  - Apache Druid
  - Apache Druid REST API
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
